name: pitchlab

services:
  postgres:
    image: postgres:16-alpine
    container_name: pitchlab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitchlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitchlab}
      POSTGRES_DB: ${POSTGRES_DB:-pitchlab}
      # Statcast is a read-heavy analytical workload; give the planner room.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=100
      # Log anything slow enough to matter, so index regressions surface.
      - -c
      - log_min_duration_statement=200
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitchlab} -d ${POSTGRES_DB:-pitchlab}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Persistence is off and eviction is on, deliberately. Nothing here is a
    # record: every key is recomputable from PostgreSQL, so durability would
    # buy nothing and an eviction is indistinguishable from a cold cache.
    # Configuring it this way is also a statement -- a Redis that cannot
    # survive a restart cannot quietly become the system of record.
    image: redis:7-alpine
    container_name: pitchlab-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # The official Apache image in KRaft mode: no ZooKeeper, one container,
    # multi-arch so it runs natively on Apple Silicon.
    image: apache/kafka:3.9.0
    container_name: pitchlab-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so nothing can be replicated further than itself.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly, with the partition counts and retention
      # the design calls for. Auto-creation would silently give every topic
      # one partition and destroy the per-session ordering guarantee.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: pitchlab-local-cluster-1
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pitchlab-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: pitchlab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    profiles: ["tools"]

  pitchlab-ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: pitchlab-ml
    environment:
      PITCHLAB_MODELS_DIR: /models
      PITCHLAB_LOG_LEVEL: ${PITCHLAB_LOG_LEVEL:-info}
      PITCHLAB_VERSION: ${PITCHLAB_VERSION:-dev}
    volumes:
      # Models are mounted rather than baked in: they are large, they change
      # on their own schedule, and rebuilding the image to ship a retrained
      # model would couple two release cycles that are deliberately separate.
      - ./models:/models:ro
    ports:
      - "${PITCHLAB_ML_PORT:-8000}:8000"
    profiles: ["app", "ml"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  api:
    # One image, six binaries. Which one runs is chosen here rather than at
    # build time, so the processor and the API can never drift out of step
    # with the domain model they share.
    build:
      context: .
      args:
        VERSION: ${PITCHLAB_VERSION:-dev}
    image: pitchlab-go:${PITCHLAB_VERSION:-dev}
    container_name: pitchlab-api
    entrypoint: ["/usr/local/bin/api"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Redis is listed but not waited on: the API starts without it by
      # design, and making it a startup condition would quietly turn a cache
      # into a dependency.
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pitchlab}:${POSTGRES_PASSWORD:-pitchlab}@postgres:5432/${POSTGRES_DB:-pitchlab}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      PITCHLAB_ML_URL: http://pitchlab-ml:8000
      PITCHLAB_API_ADDR: ":8081"
      PITCHLAB_ALLOWED_ORIGINS: http://localhost:5174,http://localhost:5173
      PITCHLAB_LOG_LEVEL: ${PITCHLAB_LOG_LEVEL:-info}
      PITCHLAB_VERSION: ${PITCHLAB_VERSION:-dev}
    ports:
      - "${PITCHLAB_API_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles: ["app"]

  processor:
    # Deliberately no build section: it runs the same image as the API, and
    # two services declaring the same tag makes the builder refuse to write it
    # twice. `docker compose build` builds it once, under api, and this
    # service just picks it up.
    image: pitchlab-go:${PITCHLAB_VERSION:-dev}
    container_name: pitchlab-processor
    entrypoint: ["/usr/local/bin/processor"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pitchlab}:${POSTGRES_PASSWORD:-pitchlab}@postgres:5432/${POSTGRES_DB:-pitchlab}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      PITCHLAB_ML_URL: http://pitchlab-ml:8000
      PITCHLAB_PROCESSOR_METRICS_ADDR: ":9091"
      PITCHLAB_LOG_LEVEL: ${PITCHLAB_LOG_LEVEL:-info}
      PITCHLAB_VERSION: ${PITCHLAB_VERSION:-dev}
    ports:
      - "${PITCHLAB_PROCESSOR_PORT:-9091}:9091"
    profiles: ["app"]

  web:
    # The dashboard is a static bundle behind nginx, which also proxies the API
    # and the live channel so the browser sees a single origin. Under a
    # profile because the demo stack is usually driven from the dev server.
    build:
      context: ./web
    container_name: pitchlab-web
    depends_on:
      - api
    ports:
      - "${PITCHLAB_WEB_PORT:-5174}:8080"
    profiles: ["app", "web"]

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: pitchlab-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Short retention on purpose: this is a development stack, and a
      # fortnight of samples is more than any demo needs.
      - --storage.tsdb.retention.time=14d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      # The services usually run on the host during development while
      # Prometheus runs here. Without this the scrape config cannot reach them
      # on Linux, where host.docker.internal is not resolved by default.
      - "host.docker.internal:host-gateway"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: pitchlab-grafana
    depends_on:
      - prometheus
    environment:
      # No login for a local stack. Authentication is out of scope for v1, and
      # a password nobody can look up is worse than none at all.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      # Data source and dashboards are provisioned from the repository, so a
      # fresh checkout comes up with all five dashboards already there.
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    profiles: ["observability"]

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  kafka-data:
