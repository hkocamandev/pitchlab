name: pitchlab

services:
  postgres:
    image: postgres:16-alpine
    container_name: pitchlab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitchlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitchlab}
      POSTGRES_DB: ${POSTGRES_DB:-pitchlab}
      # Statcast is a read-heavy analytical workload; give the planner room.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=100
      # Log anything slow enough to matter, so index regressions surface.
      - -c
      - log_min_duration_statement=200
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitchlab} -d ${POSTGRES_DB:-pitchlab}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pitchlab-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # The official Apache image in KRaft mode: no ZooKeeper, one container,
    # multi-arch so it runs natively on Apple Silicon.
    image: apache/kafka:3.9.0
    container_name: pitchlab-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so nothing can be replicated further than itself.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly, with the partition counts and retention
      # the design calls for. Auto-creation would silently give every topic
      # one partition and destroy the per-session ordering guarantee.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: pitchlab-local-cluster-1
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pitchlab-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: pitchlab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    profiles: ["tools"]

  pitchlab-ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: pitchlab-ml
    environment:
      PITCHLAB_MODELS_DIR: /models
      PITCHLAB_LOG_LEVEL: ${PITCHLAB_LOG_LEVEL:-info}
      PITCHLAB_VERSION: ${PITCHLAB_VERSION:-dev}
    volumes:
      # Models are mounted rather than baked in: they are large, they change
      # on their own schedule, and rebuilding the image to ship a retrained
      # model would couple two release cycles that are deliberately separate.
      - ./models:/models:ro
    ports:
      - "${PITCHLAB_ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  kafka-data:
