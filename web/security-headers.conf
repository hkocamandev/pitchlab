# Response headers for every document this server returns.
#
# In a file because nginx's add_header does not merge across levels: a
# location that sets any header of its own discards the ones it would
# otherwise inherit. Three of the four locations here set a Cache-Control, so
# server-level headers would silently vanish from exactly the responses that
# carry the application. Including the same file in each location makes that
# impossible to get wrong by editing one block.
#
# "always" so the headers are present on error responses too -- a 404 or a 502
# is still a document the browser renders.

# The dashboard's own policy. The API sends a far stricter one for its JSON;
# this one has to permit the things an application actually does.
#
#   script-src 'self'        -- no inline script, so an injected <script> or a
#                               javascript: URL does not execute. This is the
#                               directive that makes the rest worth having.
#   style-src  'unsafe-inline' -- conceded, not overlooked: the charting library
#                               sets element styles directly, and the
#                               alternative is a nonce threaded through a
#                               third-party renderer. Inline style is a much
#                               narrower capability than inline script.
#   connect-src 'self'       -- covers the WebSocket, which under CSP3 is
#                               same-origin because it goes to this host.
#   frame-ancestors 'none'   -- not framable, so clickjacking has nothing to
#                               work with.
#   base-uri 'none'          -- an injected <base> cannot re-point every
#                               relative script URL at another host.
#   form-action 'self'       -- the login form cannot be made to post the
#                               password somewhere else.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# no-referrer, not the usual strict-origin-when-cross-origin: a URL here
# contains athlete and session identifiers, and there is no third party this
# deployment needs to send them to.
add_header Referrer-Policy "no-referrer" always;

add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

# Deliberately no Strict-Transport-Security. This server listens on plain HTTP
# behind whatever terminates TLS; sending HSTS from here would either be
# ignored or -- worse, on a development host -- pin localhost to https in the
# browser's own store, which is unpleasant to undo. The TLS terminator sends it.
