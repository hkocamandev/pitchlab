server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. It is named here so that proxy_pass can take a
  # variable, which is what makes the upstream resolve per request instead of
  # at startup.
  #
  # Without this the container refuses to boot when the API is not up yet:
  # nginx resolves a literal upstream host once, at configuration load, and
  # exits if it cannot. A dashboard that cannot start because the service it
  # displays is starting is a dependency in the wrong direction -- the same
  # mistake as refusing to boot over a cache.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8081;

  # Assets are content-hashed by the build, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The API and the live channel are proxied so the browser sees one origin.
  # Pointing the app at a different host would mean a base URL configured per
  # environment and that origin allowed on the server.
  #
  # $request_uri is explicit because proxy_pass with a variable does not pass
  # the original URI on its own -- without it every request would arrive at
  # the API as "/".
  location /api/ {
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    # A live channel is idle between pitches. The default 60s read timeout
    # would close it during any realistic gap between at-bats.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # A single-page app needs every unknown path to return index.html, or a
  # refresh on /athletes/<id> is a 404 from nginx before React ever runs.
  # index.html itself must not be cached, or a deploy is invisible until
  # someone clears their browser.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
